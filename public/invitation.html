<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Planner · Invitation Card</title>
  <meta name="description" content="View and print your personalised event invitation card.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#14422d">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/invitation.js"></script>
</head>
<body class="invitation-page">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header no-print">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
      <circle cx="16" cy="16" r="15" fill="currentColor" opacity=".12"/>
      <path d="M16 6c5 4 7 8 7 11a7 7 0 0 1-14 0c0-3 2-7 7-11Z" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M16 12v13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <div>
      <h1><a class="brand" href="/">Event Planner</a></h1>
      <p class="tagline">Personalised invitation card</p>
    </div>
    <nav aria-label="Site" class="header-cta">
      <a class="button secondary" href="/plan">Back to planner</a>
    </nav>
  </header>

  <main id="main" class="invitation-standalone-layout">
    <div class="invitation-page-toolbar no-print">
      <div class="toolbar-left">
        <a class="button ghost" href="/plan">← Return to plan</a>
        <button class="button primary" id="print-invitation-btn" type="button">🖨️ Print invitation card</button>
        <button class="button secondary" id="copy-text-btn" type="button">📋 Copy invitation text</button>
      </div>
      <div id="theme-selector" class="invitation-theme-picker" role="group" aria-label="Card theme"></div>
    </div>

    <section id="invitation-container" class="invitation-standalone-center" aria-label="Event invitation card">
      <div id="invitation-slot"></div>
    </section>

    <section id="no-invitation" class="card empty-state" hidden>
      <h2>No invitation found</h2>
      <p class="muted">You have not created a plan yet or storage was cleared.</p>
      <a class="button primary" href="/plan">Create a plan</a>
    </section>
  </main>

  <p id="status" class="status" role="status" aria-live="polite"></p>

  <footer class="site-footer no-print">
    <nav aria-label="Footer">
      <a href="/">Home</a> ·
      <a href="/plan">Plan an event</a> ·
      <a href="/contact">Contact</a>
    </nav>
    <p>Invitations are generated by Event Planner and can be printed or shared.</p>
  </footer>
</body>
</html>
